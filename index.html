<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b31c44">
  <!-- 홈 화면에 추가해 열면 주소창 없이 화면 전체(상태바 · 다이내믹 아일랜드 뒤까지)를 쓴다 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CULER">
  <title>BARÇA ARCHIVE : CULER</title>

  <!-- Typography System: Instrument Serif (Regular, Italic) + Asta Sans (Light 300, Medium 500, ExtraBold 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300;500;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="editorial-app" id="app">

    <!-- 402 × 874 기준 프레임: 모바일은 화면 전체, PC/가로 화면은 세로 비율로 가운데 정렬 -->
    <div class="frame" id="frame">

      <!-- 배경: 6색 아코디언 줄무늬 → 챕터를 열면 챕터 색 + 카드 이미지 블러 -->
      <div class="bg-system" aria-hidden="true">
        <div class="bg-stripes" id="bgStripes"></div>
        <div class="bg-reading" id="bgReading">
          <img class="bg-reading-blur" id="bgReadingBlur" alt="">
        </div>
      </div>

      <!-- ===== HOME: 목차 (좌우 스와이프로 챕터 선택) → 챕터 인트로로 변형 ===== -->
      <section class="home" id="home" aria-label="목차">

        <header class="home-header">
          <h1 class="dedication typo-h1"><button class="dedication-btn" id="openLetter" aria-label="For Jihoon — 편지 열기">For Jihoon</button></h1>
          <a class="club-emblem" id="clubEmblem" href="https://open.spotify.com/playlist/37i9dQZF1DWUpkPw8XOgDP?si=oYjdM0uqS3qmC5ptpqaK1Q" target="_blank" rel="noopener noreferrer" aria-label="Spotify 플레이리스트 열기 (새 탭)">
            <img src="barca_logo.svg" alt="FC Barcelona">
          </a>
        </header>

        <div class="chapter-number-track" id="chapterNumberTrack" aria-hidden="true"></div>

        <div class="carousel-stage" id="carouselStage">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>

        <div class="title-wheel" id="titleWheel"></div>

        <!-- 인트로 하단 스크롤 안내 (Material Symbols: keyboard_double_arrow_down) -->
        <div class="intro-chevron" id="introChevron" aria-hidden="true">
          <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M480-200 240-440l56-56 184 183 184-183 56 56-240 240Zm0-240L240-680l56-56 184 183 184-183 56 56-240 240Z"/></svg>
        </div>

        <button class="nav-arrow nav-prev" id="navPrev" aria-label="이전 챕터">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="nav-arrow nav-next" id="navNext" aria-label="다음 챕터">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </section>

      <!-- ===== LETTER: For Jihoon 을 누르면 나타나는 편지 (아무 곳이나 누르면 닫힘) ===== -->
      <section class="letter" id="letter" role="dialog" aria-label="Jihoon에게 보내는 편지" tabindex="-1" aria-hidden="true" inert>
        <img class="letter-emblem" src="barca_logo.svg" alt="FC Barcelona">
        <h2 class="letter-title typo-h1">For Jihoon Culer</h2>
        <p class="letter-body">FC 바르싸를 응원하게 된걸 환영한다.
이 웹페이지를 통해서 바르셀로나에서의 직관이
더 알차고, 즐겁기를 바란다!
거의 2년 동안의 공익생활 수고했고,
이번 여행을 통해 좋은 기운 받고,
성공한 꾸레가 되기를 바란다!</p>
        <p class="letter-sign typo-quote">Visca el Barça</p>
      </section>

      <!-- ===== CHAPTER: 인트로(첫 화면) 아래로 스크롤하며 읽는 본문 ===== -->
      <article class="chapter-view" id="chapterView" aria-hidden="true" inert>
        <div class="cv-scroll" id="cvScroll">
          <div class="cv-intro" id="cvIntro"></div>
          <div class="cv-content" id="cvContent"></div>
        </div>

        <div class="cv-topbar" id="cvTopbar">
          <!-- Material Symbols: home / close -->
          <button class="cv-icon" id="cvHome" aria-label="목차로 돌아가기">
            <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
          </button>
          <span class="cv-topbar-title typo-h1" id="cvTopbarTitle"></span>
          <button class="cv-icon" id="cvClose" aria-label="닫기">
            <svg viewBox="0 -960 960 960" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
          </button>
        </div>
      </article>

      <!-- ===== 앱 UI (PC 전용): 상태바 + Safari 하단바. 화면 위에 덮어 보여주기만 하고 클릭은 통과 ===== -->
      <div class="device-ui" aria-hidden="true">
        <span class="device-time">9:41</span>
        <span class="device-island"></span>
        <span class="device-indicators">
          <svg class="di-signal" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg class="di-wifi" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5.1.1.3.1.4 0l1.1-1.1c.1-.1.1-.3 0-.4C14.2 1.2 11.5 0 8.5 0S2.8 1.2.7 3.3c-.1.1-.1.3 0 .4l1.1 1.1c.1.1.3.1.4 0 1.7-1.6 3.900-2.500 6.300-2.500Zm0 3.900c1.300 0 2.500.5 3.400 1.300.1.1.3.1.4 0l1.100-1.100c.1-.1.1-.3 0-.4a7.100 7.100 0 0 0-9.800 0c-.1.1-.1.3 0 .4l1.100 1.100c.1.1.3.1.4 0 .9-.8 2.100-1.300 3.400-1.300Zm2.200 2.700c.1-.1.1-.3 0-.4a3.600 3.600 0 0 0-4.400 0c-.1.1-.1.3 0 .4l1.900 1.900c.1.1.3.1.4 0l2.100-1.900Z"/></svg>
          <svg class="di-battery" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.500" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.200" fill="currentColor"/><path d="M25 4.500v4c.800-.3 1.500-1.100 1.500-2s-.7-1.700-1.500-2Z" fill="currentColor" opacity=".45"/></svg>
        </span>
        <div class="device-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V3"/><polyline points="8.500 6.500 12 3 15.500 6.500"/><path d="M8 9.500H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7.500a2 2 0 0 0-2-2h-1"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.500C10 5 7 4.500 3.500 5v13c3.500-.5 6.500 0 8.500 1.500 2-1.500 5-2 8.500-1.500V5C17 4.500 14 5 12 6.500Z"/><path d="M12 6.500v13"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="13" height="13" rx="2.500"/><path d="M16 19.500a2.500 2.500 0 0 1-2.500 1.500H6A3 3 0 0 1 3 18V10.500A2.500 2.500 0 0 1 4.500 8"/></svg>
        </div>
      </div>

    </div>

    <!-- PC 전용: 앱 UI 보기 켜기/끄기 -->
    <button class="device-toggle" id="deviceToggle" type="button" aria-pressed="true">앱 UI 보기 <b>ON</b></button>
  </div>

  <!-- 모바일에서 챕터를 읽을 때 문서 높이를 만드는 투명 공간 (주소창 축소용) -->
  <div class="scroll-spacer" id="scrollSpacer" aria-hidden="true"></div>

  <script src="chapters.js"></script>
  <script src="main.js"></script>
</body>
</html>
